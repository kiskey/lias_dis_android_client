name: LIAS Android Plan 3.1 Devices Card UX
on:
  workflow_dispatch:
  push:
    branches:
      - luna
jobs:
  validate-plan31-devices-card-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Static Plan 3.1 Devices card UX audit
        run: |
          chmod +x scripts/audit_plan31_devices_card_ux.py scripts/verify_plan31_devices_card_ux.sh
          scripts/verify_plan31_devices_card_ux.sh
      - name: Compile, test, lint, package
        run: |
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
