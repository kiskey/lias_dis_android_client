# ====================================================================
# File: .github/workflows/ci.yml
# Version: 1.2.0
# Audit Fixes:
#   1. Updated Gradle wrapper generation to 8.10.2 to satisfy AGP 8.8.0
#      minimum version requirement for Android compileSdk 36 build.
# ====================================================================

name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Lint, Test, and Build Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Audit Fix (CI-1.2): Generate Gradle wrapper 8.10.2 for AGP 8.8.0 compatibility
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lias-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
