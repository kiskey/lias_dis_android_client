# ====================================================================
# File: .github/workflows/ci.yml
# Version: 27.0.0
#
# Purpose:
#   Reproducible Android verification.
#
# Batch 27:
#   - Uses repository Gradle wrapper.
#   - Does NOT regenerate wrapper during CI.
#   - Verifies unit tests before APK assembly.
#   - Runs lint.
#   - Runs debug compilation explicitly.
#   - Uploads debug APK only after all checks succeed.
# ====================================================================

name: Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  verify:

    name: Verify Android Client

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Compile debug Kotlin
        run: |
          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace

      - name: Run unit tests
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            --stacktrace

      - name: Run Android lint
        run: |
          ./gradlew \
            :app:lintDebug \
            --stacktrace

      - name: Assemble debug APK
        run: |
          ./gradlew \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lias-remote-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
