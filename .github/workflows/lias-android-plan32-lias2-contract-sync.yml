name: LIAS Android Plan 3.2 LIAS 2.0 Contract Sync

on:
  workflow_dispatch:
  push:
    branches:
      - luna

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Plan 3.2 static contract gate
        run: |
          chmod +x scripts/*.sh scripts/*.py
          scripts/verify_plan32_lias2_contract_sync.sh
      - name: Compile, test, lint, package
        run: |
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
