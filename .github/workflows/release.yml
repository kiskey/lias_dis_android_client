# ====================================================================
# File: .github/workflows/release.yml
# Version: 1.0.0
# Purpose: Manual-run pipeline. Builds a debug APK and publishes it 
#          to the "latest" GitHub Release.
# ====================================================================

name: Release Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug Build"
          body: |
            ## LIAS Remote Debug Build
            Automated debug build generated from commit `${{ github.sha }}`.
            
            **Note:** This is an unsigned debug build for testing purposes.
          prerelease: false
          make_latest: "true"
          files: app/build/outputs/apk/debug/*.apk
