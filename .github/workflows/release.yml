# ====================================================================
# File: .github/workflows/release.yml
# Version: 1.1.0
# Audit Fixes:
#   1. Updated Gradle wrapper generation to 8.10.2 for AGP 8.8.0 compatibility.
# ====================================================================

name: Release Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug Build"
          body: |
            ## LIAS Remote Debug Build
            Automated debug build generated from commit `${{ github.sha }}`.
            
     #       **Note:** This is an unsigned debug build for testing purposes.
          prerelease: false
          make_latest: "true"
          files: app/build/outputs/apk/debug/*.apk
