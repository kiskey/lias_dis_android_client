name: LIAS Android Plan 3.1 Final Cupertino Polish

on:
  workflow_dispatch:
  push:
    branches:
      - luna

jobs:
  validate-plan31-final-cupertino-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Static Plan 3.1 final Cupertino polish audit
        run: |
          chmod +x scripts/*.sh scripts/*.py
          scripts/verify_plan31_final_cupertino_polish.sh
      - name: Compile, test, lint, package
        run: |
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
