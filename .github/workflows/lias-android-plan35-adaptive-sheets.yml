name: LIAS Android Plan 3.5 Adaptive Cupertino Sheets

on:
  workflow_dispatch:
  push:
    branches:
      - luna

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Plan 3.5 static gates
        run: |
          chmod +x scripts/*.sh scripts/*.py
          scripts/verify_plan35_batch001.sh
          python3 scripts/verify_plan35_batch002.py
          python3 scripts/verify_plan35_batch003.py
          python3 scripts/verify_plan35_adaptive_sheet_presentation.py

      - name: Plan 3.3 regression gates
        run: |
          scripts/verify_plan33_batch003_remote_exact.sh
          scripts/verify_plan33_batch004.sh
          python3 scripts/audit_plan33_modal_integration_remote_exact.py
          python3 scripts/verify_plan33_alert_separation.py
          scripts/verify_plan33_final_motion_remote_exact.sh
          python3 scripts/verify_plan33_bottom_attached_sheet_geometry.py
          python3 scripts/verify_plan33_sheet_regression_stabilization.py

      - name: Plan 3.4 regression gates
        run: |
          scripts/verify_plan34_batch001.sh
          scripts/verify_plan34_batch002.sh
          scripts/verify_plan34_batch003.sh
          scripts/verify_plan34_batch004.sh
          python3 scripts/verify_plan34_final.py

      - name: Compile, test, lint, package
        run: |
          gradle \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            --stacktrace
