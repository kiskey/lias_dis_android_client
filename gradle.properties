# ====================================================================
# File: gradle.properties
# Version: 1.1.0
# Audit Fixes:
#   1. Added android.suppressUnsupportedCompileSdk=36 to ensure clean AGP
#      compilation when using compileSdk 36.
# ====================================================================

# JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true

# Enable Jetifier for legacy support (if needed)
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Suppress compileSdk warning for AGP
android.suppressUnsupportedCompileSdk=36
