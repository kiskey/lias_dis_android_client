# ====================================================================
# File: gradle.properties
# Version: 1.0.0
# Purpose: Project-wide Gradle settings. Enables AndroidX and Compose.
# ====================================================================

# JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true

# Enable Jetifier for legacy support (if needed)
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Compose compiler metrics (optional, useful for debugging)
# compose.compiler.metrics=true
