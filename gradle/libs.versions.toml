# ====================================================================
# File: gradle/libs.versions.toml
# Version: 27.5.0
#
# Purpose:
#   Central version catalog for LIAS Remote.
#
# Stabilization 27.5:
#   - Fixes nonexistent Robolectric 4.13.2 artifact.
#   - Uses Robolectric 4.16.1 for compileSdk/API 36 test support.
#
# Fix:
#   Gradle version catalogs require TOML inline dependency/plugin tables
#   to be syntactically complete. All inline tables are kept on one line.
#
# Build contract:
#   AGP        8.9.3
#   Kotlin     2.0.20
#   Gradle     8.11.1
#   Java       17
#   compileSdk 36
#   targetSdk  35
# ====================================================================

[versions]

agp = "8.9.3"
kotlin = "2.0.20"

coreKtx = "1.13.1"
lifecycle = "2.8.3"
activityCompose = "1.9.0"
biometric = "1.1.0"

composeBom = "2024.09.00"
navigationCompose = "2.7.7"

okhttp = "4.12.0"

kotlinxSerialization = "1.6.3"
kotlinxCoroutines = "1.8.1"

datastore = "1.1.1"

junit = "4.13.2"

mockWebServer = "4.12.0"
robolectric = "4.16.1"
archCoreTesting = "2.2.0"

cupertino = "0.1.0-alpha04"


[libraries]

# --------------------------------------------------------------------
# AndroidX core / lifecycle
# --------------------------------------------------------------------

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }


# --------------------------------------------------------------------
# Compose / Activity
# --------------------------------------------------------------------

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }


# --------------------------------------------------------------------
# Navigation
# --------------------------------------------------------------------

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }


# --------------------------------------------------------------------
# Networking
# --------------------------------------------------------------------

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }


# --------------------------------------------------------------------
# Kotlin
# --------------------------------------------------------------------

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }


# --------------------------------------------------------------------
# Persistence
# --------------------------------------------------------------------

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }


# --------------------------------------------------------------------
# Unit / contract testing
# --------------------------------------------------------------------

junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockWebServer" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }


# --------------------------------------------------------------------
# Compose Cupertino
# --------------------------------------------------------------------

cupertino = { group = "io.github.alexzhirkevich", name = "cupertino", version.ref = "cupertino" }
cupertino-icons-extended = { group = "io.github.alexzhirkevich", name = "cupertino-icons-extended", version.ref = "cupertino" }


[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
